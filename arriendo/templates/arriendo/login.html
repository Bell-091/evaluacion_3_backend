{% extends 'base.html' %}

{% block title %}Iniciar Sesión | RentMaq{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-warning fs-1"></i>
                <h3 class="fw-bold mt-2">Acceso a RentMaq</h3>
                <p class="text-muted small">Ingrese sus credenciales de usuario o administrador</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre de Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej: admin o cliente" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">Iniciar Sesión</button>
            </form>

            <div class="text-center mt-4 border-top pt-3">
                <p class="small text-muted mb-0">¿No tiene cuenta? <a href="{% url 'registro' %}" class="fw-bold text-dark">Regístrese aquí</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
